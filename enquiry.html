<section class="banner" data-img="slide3"><h1>Start Your Order</h1></section>

<main>
<form id="orderForm" data-validate action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>
 <div><label for="fullname">Full Name</label><input id="fullname" name="fullname" data-rule="name" autocomplete="name" required minlength="2" maxlength="60"><span class="err"></span></div>
 <div><label for="email">Email</label><input id="email" type="email" name="email" data-rule="email" autocomplete="email" required maxlength="80"><span class="err"></span></div>
 <div><label for="phone">Phone Number</label><input id="phone" type="tel" name="phone" data-rule="phone" placeholder="0821234567" autocomplete="tel" required pattern="(\+27|0)[0-9 ]{9,12}" maxlength="16"><span class="err"></span></div>
 <div><label for="flavour">Preferred Flavour</label><select id="flavour" name="flavour" data-rule="select" required><option value="">-- Select --</option><option>Vanilla</option><option>Chocolate</option><option>Red Velvet</option><option>Lemon &amp; Berry</option><option>Caramel</option></select><span class="err"></span></div>
 <div><label for="size">Cake Size</label><select id="size" name="size" data-rule="select" required><option value="">-- Select --</option><option value="Small">Small (8–10 servings)</option><option value="Medium">Medium (15–20 servings)</option><option value="Large">Large (25–30 servings)</option><option value="Tiered">Tiered (40+ servings)</option></select><span class="err"></span></div>
 <div><label for="date">Event Date</label><input id="date" type="date" name="date" data-rule="date" required><span class="err"></span></div>
 <div><label for="diet">Dietary Requirements</label><select id="diet" name="diet" data-rule="select" required><option value="">-- Select --</option><option>None</option><option>Eggless</option><option>Gluten-free</option></select><span class="err"></span></div>
 <div><label for="theme">Theme / Design Details</label><textarea id="theme" name="theme" rows="3" maxlength="500" placeholder="Colours, theme, message on the cake..."></textarea></div>
 <button class="btn rose" type="submit">Submit Order Enquiry</button>
</form>
<div class="result" id="result" aria-live="polite"></div>
</main>
